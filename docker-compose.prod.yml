version: '3.8'

services:
  app:
    image: ghcr.io/${REPO}-app:latest
    restart: unless-stopped
    volumes:
      - plansync_uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    networks:
      - webproxy
      - postgres_network # Assuming the shared db is on a specific network, this can be configured if needed, but often the DATABASE_URL handles routing (e.g., host IP or explicit network DNS)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plansync.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.plansync.entrypoints=websecure"
      - "traefik.http.routers.plansync.tls.certresolver=myresolver"
      - "traefik.http.services.plansync.loadbalancer.server.port=3000"

volumes:
  plansync_uploads:

networks:
  webproxy:
    external: true
  postgres_network:
    external: true
