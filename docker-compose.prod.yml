version: '3.8'

services:
  app:
    image: ghcr.io/${REPO}-app:latest
    restart: unless-stopped
    volumes:
      - plansync_uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    networks:
      - portfolio-network
      - shared-database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portfolio-network"
      - "traefik.http.routers.plansync.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.plansync.entrypoints=websecure"
      - "traefik.http.routers.plansync.tls.certresolver=myresolver"
      - "traefik.http.services.plansync.loadbalancer.server.port=3000"

volumes:
  plansync_uploads:

networks:
  portfolio-network:
    name: portfolio_portfolio-network
    external: true

  shared-database:
    external: true