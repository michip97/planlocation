version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plansync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plansync_db}
    volumes:
      - plansync_db_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    image: ghcr.io/${REPO}-app:latest
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - plansync_uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-plansync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plansync_db}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    networks:
      - internal
      - webproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plansync.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.plansync.entrypoints=websecure"
      - "traefik.http.routers.plansync.tls.certresolver=myresolver"
      - "traefik.http.services.plansync.loadbalancer.server.port=3000"

volumes:
  plansync_db_data:
  plansync_uploads:

networks:
  internal:
  webproxy:
    external: true
