services:
  app:
    image: ghcr.io/${REPO}-app:latest
    container_name: plansync-app-prod
    restart: always
    # Provide 512 MB /dev/shm RAM filesystem inside the container for zero-disk-thrashing libvips tiling
    shm_size: '512mb'
    volumes:
      - plansync_uploads:/app/backend/uploads
      - plansync_tiles:/app/storage/tiles
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TILES_STORAGE_DIR=/app/storage/tiles
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - webproxy
      - shared-database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=webproxy"
      - "traefik.http.routers.plansync.rule=Host(`${DOMAIN:-planlocationtest.michaelportmann.ch}`)"
      - "traefik.http.routers.plansync.entrypoints=websecure"
      - "traefik.http.routers.plansync.tls=true"
      - "traefik.http.routers.plansync.tls.certresolver=myresolver"
      - "traefik.http.services.plansync.loadbalancer.server.port=3000"

volumes:
  plansync_uploads:
  plansync_tiles:

networks:
  webproxy:
    external: true
  shared-database:
    external: true
