name: Deploy to VPS via GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push Fullstack Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare target directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/plansync

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/plansync"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/plansync

            # Login to GHCR (Server needs access to pull images)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Normalize REPO to lowercase and sanitize DOMAIN (strip http://, https://, and trailing /)
            REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            RAW_DOMAIN="${{ secrets.DOMAIN }}"
            CLEAN_DOMAIN="$(echo "${RAW_DOMAIN:-planlocationtest.michaelportmann.ch}" | sed -E 's#^https?://##; s#/.*$##')"

            # Persist environment variables for docker compose
            cat <<EOF > /opt/plansync/.env
            REPO=${REPO_LOWER}
            DOMAIN=${CLEAN_DOMAIN}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            chmod 600 /opt/plansync/.env

            # Ensure the external networks exist (for Traefik reverse proxy and shared PostgreSQL)
            docker network inspect webproxy >/dev/null 2>&1 || docker network create webproxy
            docker network inspect shared-database >/dev/null 2>&1 || docker network create shared-database

            # Connect the existing traefik-prod container (from the portfolio stack) to webproxy
            # so it can route traffic to plansync-app-prod and issue Let's Encrypt SSL via myresolver
            if docker ps --format '{{.Names}}' | grep -q '^traefik-prod$'; then
              docker network connect webproxy traefik-prod 2>/dev/null || true
            fi

            # Pull new image and recreate container with zero unnecessary downtime
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # Clean up dangling images
            docker image prune -f
